schema_version: engram-claims-v1
updated_at: 2026-08-16

claims:
  - id: ENG-001
    claim: A prior execution can materially change a later Engram decision under comparable context.
    state: VERIFIED
    evidence:
      - tests/e2e/memory-caused-behavior.test.ts
      - tests/e2e/demo-orchestration.test.ts
      - services/demo/src/run-runtime-demo.ts
      - experiments/EXP-001-memory-caused-decision
      - GitHub Actions Engram CI run 31921774367
    boundary: Deterministic simulated external execution; causal behavior is tested through the Engram runtime and provenance model.

  - id: ENG-002
    claim: Engram persists executions, memories, retrievals, decisions, outcomes, runtime evaluations, and memory-to-decision provenance in CockroachDB.
    state: IMPLEMENTED
    evidence:
      - db/migrations/001_initial.sql
      - db/migrations/002_runtime.sql
      - packages/cockroach/src/repository.ts
      - packages/cockroach/src/runtime-store.ts
      - packages/cockroach/src/atomic-runtime-store.ts
      - tests/integration/cockroach-memory-loop.test.ts
      - tests/integration/cockroach-runtime.test.ts
    promotion_condition: Successful Engram Live Verification run against CockroachDB Cloud with evidence/live/latest.json artifact.

  - id: ENG-003
    claim: Engram performs agent-scoped cosine vector retrieval using CockroachDB Cloud VECTOR/C-SPANN.
    state: IMPLEMENTED
    evidence:
      - db/migrations/001_initial.sql
      - db/migrations/005_cosine_vector_index.sql
      - db/migrations/006_agent_scoped_vector_index.sql
      - db/migrations/007_agent_cosine_vector_index.sql
      - packages/cockroach/src/memory.ts
      - packages/cockroach/src/vector-plan.ts
      - services/verification/src/live-verify.ts
    boundary: Production retrieval is agent-scoped and uses cosine distance. Automated code captures a natural EXPLAIN plan and distinguishes successful vector-distance retrieval from actual C-SPANN index selection.
    promotion_condition: Successful live verification artifact where vectorIndex.usesVectorSearch and vectorIndex.usesCosineIndex prove that CockroachDB naturally selected memories_agent_embedding_cosine_idx for the live retrieval query shape.

  - id: ENG-004
    claim: Amazon Bedrock Titan Embeddings V2 supplies Engram memory/query embeddings.
    state: IMPLEMENTED
    evidence:
      - packages/bedrock/src/embeddings.ts
      - services/verification/src/live-verify.ts
    promotion_condition: Successful live verification artifact produced with Bedrock credentials and no deterministic test embedding provider.

  - id: ENG-005
    claim: CockroachDB Cloud Managed MCP can inspect Engram memory provenance through a read-only agent-facing plane.
    state: IMPLEMENTED
    evidence:
      - packages/cockroach-mcp/src/client.ts
      - services/api/src/handler.ts
      - services/verification/src/live-verify.ts
    promotion_condition: Successful live verification artifact containing MCP status and select_query provenance output.

  - id: ENG-006
    claim: Engram can run as an AWS Lambda HTTP API using the SAM deployment definition.
    state: IMPLEMENTED
    evidence:
      - template.yaml
      - services/api/src/handler.ts
      - .github/workflows/sam-build.yml
      - .github/workflows/aws-deploy-verification.yml
      - GitHub Actions Engram SAM Build run 31935001857
    boundary: The SAM application packages successfully in CI. Actual Lambda deployment and public API operation remain UNVERIFIED.
    promotion_condition: Successful Engram AWS Deploy Verification run proving sam deploy, public health, runtime demo, protected trace, protected control-plane/evaluation reads, and MCP inspection endpoints.

  - id: ENG-007
    claim: Engram exposes an evidence-first four-screen interface for Execute, Live Trace, Memory Explorer, and Compare Runs.
    state: TESTED
    evidence:
      - apps/web
      - GitHub Actions Engram CI web build
    boundary: Build verified; public deployment not yet verified.

  - id: ENG-008
    claim: The external multi-venue workload in the MVP is a live market execution.
    state: FALSE
    evidence:
      - packages/execution-simulator/src/index.ts
      - services/demo/src/run-runtime-demo.ts
    boundary: The workload is intentionally SIMULATED. Persistence, retrieval, provenance, runtime influence validation, and cloud integrations may be promoted independently.

  - id: ENG-009
    claim: Engram has a reproducible live-verification path for the runtime causal spine and external CockroachDB, Bedrock, Managed MCP, and vector-plan evidence.
    state: TESTED
    evidence:
      - services/verification/src/live-verify.ts
      - packages/cockroach/src/migrations.ts
      - packages/cockroach/src/vector-plan.ts
      - .github/workflows/live-verification.yml
      - GitHub Actions Engram CI run 31922956931
    boundary: The verifier writes a sanitized UNKNOWN artifact on failure and separates vector-query success from C-SPANN index selection.
    promotion_condition: Manually dispatch Engram Live Verification with required CockroachDB, AWS, and MCP secrets; successful execution must emit evidence/live/latest.json.

  - id: ENG-010
    claim: Engram enforces recall exposure and memory-influence eligibility in a stateless runtime that survives Lambda cold starts.
    state: TESTED
    evidence:
      - packages/runtime/src/runtime.ts
      - packages/runtime/src/policy.ts
      - packages/cockroach/src/runtime-store.ts
      - tests/e2e/runtime-cold-start.test.ts
      - tests/integration/cockroach-runtime.test.ts
      - GitHub Actions Engram CI run 31921774367
    boundary: Cold-start behavior is automated; live CockroachDB execution remains separately promoted by ENG-002/009.

  - id: ENG-011
    claim: Engram freezes the resolved memory-policy bundle per execution so later policy activation cannot silently change an in-flight run.
    state: TESTED
    evidence:
      - packages/policy/src/registry.ts
      - packages/cockroach/src/policy-registry.ts
      - packages/runtime/src/runtime.ts
      - tests/runtime/frozen-policy.test.ts
      - GitHub Actions Engram CI run 31921774367

  - id: ENG-012
    claim: Engram exposes one semantic runtime through TypeScript SDK, Python SDK, HTTP API, and Engram MCP rather than independent memory implementations.
    state: TESTED
    evidence:
      - packages/sdk
      - packages/python
      - packages/mcp-server
      - services/api/src/handler.ts
      - services/runtime/src/create-runtime.ts
      - tests/sdk
      - tests/mcp
      - packages/python/tests/test_client.py
      - GitHub Actions Engram CI run 31935001862
    boundary: Package/runtime conformance and TypeScript/Python Bearer-token propagation are automated; published package registries and public API deployment are not yet verified.

  - id: ENG-013
    claim: Framework adapters preserve external execution telemetry as ExecutionEpisode evidence without inferring memory-to-action causality.
    state: TESTED
    evidence:
      - packages/episode/src/schema.ts
      - packages/adapters/openai-agents/src/index.ts
      - packages/adapters/langgraph/src/index.ts
