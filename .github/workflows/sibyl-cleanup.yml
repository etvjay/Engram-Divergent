name: Sibyl Repository Cleanup

on:
  push:
    paths:
      - '.github/workflows/sibyl-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove non-Sibyl product surfaces
        shell: bash
        run: |
          set -euo pipefail

          rm -rf apps db docs evidence experiments openapi-usage services
          rm -f openapi.json template.yaml AGENTS.md CONTRIBUTING.md DECISIONS.md MIGRATION_PROVENANCE.md

          rm -rf packages/adapters
          rm -rf packages/bedrock
          rm -rf packages/cockroach
          rm -rf packages/cockroach-mcp
          rm -rf packages/control-plane
          rm -rf packages/embeddings
          rm -rf packages/episode
          rm -rf packages/execution-simulator
          rm -rf packages/mcp-server
          rm -rf packages/ollama
          rm -rf packages/python
          rm -rf packages/sdk
          rm -rf packages/vertex

          find packages/scenarios -mindepth 1 -maxdepth 1 -type d ! -name 'provider-continuity' -exec rm -rf {} +

          rm -f scripts/live-verify.ts scripts/migrate.ts

          rm -rf tests/api tests/conformance tests/e2e tests/mcp tests/runtime tests/sdk tests/security tests/unit
          find tests/adapters -type f ! -name 'virtuals-acp-evidence.test.ts' -delete 2>/dev/null || true
          find tests/integration -type f \( -name 'cockroach-*' -o -name 'ollama-*' -o -name 'vertex-*' \) -delete 2>/dev/null || true
          find tests/scenarios -type f ! -name 'provider-continuity-memory.test.ts' -delete 2>/dev/null || true

          rm -rf hackathon/sibyl

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: reduce Engram-Divergent to Sibyl-native surface'
          git push origin HEAD:main
