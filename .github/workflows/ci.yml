name: Engram Divergent CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sibyl:
    runs-on: ubuntu-latest
    env:
      ENGRAM_SIBYL_DB: /tmp/engram-divergent-ci.db
      ENGRAM_SIBYL_TENANT: engram-divergent-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Install Sibyl client
        run: python -m pip install -r packages/sibyl/requirements.txt

      - name: Build and run Sibyl-focused suite
        run: npm run check

      - name: Seed execution memory in process A
        run: npm run demo:sibyl:seed

      - name: Recall and change action in fresh process B
        run: npm run demo:sibyl:recall

      - name: Show no-memory control
        run: npm run demo:sibyl:no-memory-control

      - name: Seed accumulated provider experience
        run: npm run demo:sibyl:provider:seed

      - name: Fresh urgent provider decision uses Sibyl memory
        run: npm run demo:sibyl:provider:urgent

      - name: Fresh routine provider decision emits consequence intent
        env:
          ENGRAM_BASE_ATLAS_ADDRESS: '0x1111111111111111111111111111111111111111'
          ENGRAM_BASE_BEACON_ADDRESS: '0x2222222222222222222222222222222222222222'
          ENGRAM_BASE_INTENT_OUT: /tmp/engram-base-routine-intent.json
        run: npm run demo:sibyl:provider:routine

      - name: Prove Sibyl is load-bearing
        run: npm run test:sibyl:deletion

      - name: Smoke evidence capture
        env:
          ENGRAM_EVIDENCE_DIR: /tmp/engram-divergent-evidence
        run: npm run evidence:sibyl:capture
